; dropterm colours, rendered by a desktop theme engine.
;
; This is the "theme" layer: dropterm resolves each key as
;   user override (dropterm.conf) -> this file -> baseline (defaults.conf) -> built-in
; so a colour picked by hand in the settings window deliberately stops
; following the desktop palette, and clearing that override resumes it.
;
; Written in noctalia's template syntax, but nothing here is noctalia-specific:
; any engine that can render a file and run a command works. Point it at
; ~/.config/dropterm/theme.conf and have it run `dropterm reload` afterwards.
;
; Keys use the terminal_* palette roles rather than the UI surface roles, so the
; result is a readable terminal rather than a colour-matched panel.

[General]
foreground={{colors.terminal_foreground.default.hex}}
background={{colors.terminal_background.default.hex}}
