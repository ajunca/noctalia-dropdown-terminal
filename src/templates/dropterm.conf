; dropterm colours, rendered by a desktop theme engine.
;
; This is the "theme" layer: dropterm resolves each key as
;   user override (dropterm.conf) -> this file -> baseline (defaults.conf) -> built-in
; so a colour picked by hand in the settings window deliberately stops
; following the desktop palette, and clearing that override resumes it.
;
; Written in noctalia's template syntax, but nothing here is noctalia-specific:
; any engine that can render a file and run a command works. Point it at
; ~/.config/dropterm/theme.conf and have it run `dropterm reload` afterwards.
;
; Deliberately mixed roles.
;
; The background uses surface_variant — the same role the shell paints its bar
; and panels with — so the dropdown reads as part of that furniture rather than
; as a window that merely happens to be dark. terminal_background would be the
; obvious choice, but a Material palette makes it near-black in dark mode
; whatever the wallpaper (#16130e, #131315, #1a120c on three consecutive
; wallpapers here), so "following the theme" ends up indistinguishable from the
; built-in default and visibly mismatched against the bar.
;
; The foreground stays terminal_foreground: on_surface_variant is chosen for
; contrast against UI chrome at label sizes, not for a wall of monospaced text,
; and readability wins over matching for the thing you actually read.

[General]
foreground={{colors.terminal_foreground.default.hex}}
background={{colors.surface_variant.default.hex}}
